
name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract Android project ZIP
      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" \
            ! -iname "*apk*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Android project ZIP not found!"
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          mkdir -p proj
          unzip -q "$ZIP" -d proj

          SETTINGS=$(find proj -type f \
            -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            exit 1
          fi

          PROJ=$(dirname "$SETTINGS")

          echo "Project folder: $PROJ"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"

      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-36-ext1
            build-tools;36.0.0

      # 5. Setup Gradle 9.3.1
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # 6. Generate temporary signing key
      - name: Create signing key
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass videoplayer123 \
            -keypass videoplayer123 \
            -dname "CN=Video Player, O=VideoPlayer, C=US"

      # 7. Build Release APK
      - name: Build Release APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: videoplayer123
          KEY_ALIAS: upload
          KEY_PASSWORD: videoplayer123
        run: |
          set -e

          cd "$PROJ"

          gradle --version

          gradle :app:assembleRelease \
            --no-daemon \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # 8. Collect APK files
      - name: Collect APK files
        shell: bash
        run: |
          set -e

          APK_DIR="$PROJ/app/build/outputs/apk/release"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: Release APK directory not found!"
            exit 1
          fi

          mkdir -p dist

          find "$APK_DIR" -type f -name "*.apk" \
            -exec cp {} dist/ \;

          if [ -z "$(find dist -name "*.apk" -print -quit)" ]; then
            echo "ERROR: No APK files found!"
            exit 1
          fi

          echo "Generated APK files:"
          ls -lh dist/

      # 9. Create APK ZIP
      - name: Create APK ZIP
        shell: bash
        run: |
          cd dist
          zip -j VideoPlayer-APKs.zip ./*.apk
          ls -lh VideoPlayer-APKs.zip

      # 10. Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      # 11. Publish GitHub Release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v${{ github.run_number }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/VideoPlayer-APKs.zip \
              --clobber
          else
            gh release create "$TAG" \
              dist/VideoPlayer-APKs.zip \
              --title "Video Player Build ${{ github.run_number }}" \
              --notes "Automatically generated Android Release APKs."
          fi
