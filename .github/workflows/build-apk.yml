
name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - "**"
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Find and extract project ZIP
      - name: Extract Android project
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" \
            ! -name "*APK*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found!"
            exit 1
          fi

          echo "Found project: $ZIP"

          mkdir -p proj
          unzip -q "$ZIP" -d proj

          SETTINGS=$(find proj -type f \
            \( -name "settings.gradle.kts" \
            -o -name "settings.gradle" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "Gradle settings file not found!"
            exit 1
          fi

          PROJ=$(dirname "$SETTINGS")

          if [ ! -f "$PROJ/gradlew" ]; then
            echo "Gradle Wrapper not found!"
            exit 1
          fi

          chmod +x "$PROJ/gradlew"

          echo "Project directory: $PROJ"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"

      # 3. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Accept Android SDK licenses
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # 6. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 7. Build APK
      - name: Build Release APK
        shell: bash
        run: |
          cd "$PROJ"

          ./gradlew --version

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --console=plain

      # 8. Prepare APK ZIP
      - name: Prepare APK ZIP
        shell: bash
        run: |
          APK=$(find "$PROJ/app/build/outputs/apk/release" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK file not found!"
            exit 1
          fi

          mkdir -p dist

          cp "$APK" dist/BlueWavePlayer.apk

          cd dist

          zip BlueWavePlayer-APK.zip BlueWavePlayer.apk

          ls -lh BlueWavePlayer-APK.zip

      # 9. Upload APK ZIP as artifact
      - name: Upload APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BlueWavePlayer-APK
          path: dist/BlueWavePlayer-APK.zip

      # 10. Publish GitHub Release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ github.run_number }}"

          gh release create "$TAG" \
            dist/BlueWavePlayer-APK.zip \
            --target "${{ github.sha }}" \
            --title "BlueWavePlayer Build ${{ github.run_number }}" \
            --notes "Android Release APK"
