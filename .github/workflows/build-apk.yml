name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - "**"
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Extract project ZIP
      - name: Extract Android project
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" \
            ! -name "*APK*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP not found!"
            exit 1
          fi

          echo "Project ZIP: $ZIP"

          mkdir -p proj
          unzip -q "$ZIP" -d proj

          SETTINGS=$(find proj -type f \
            \( -name "settings.gradle.kts" \
            -o -name "settings.gradle" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found!"
            exit 1
          fi

          PROJ=$(dirname "$SETTINGS")

          if [ ! -f "$PROJ/gradlew" ]; then
            echo "ERROR: Gradle Wrapper not found!"
            exit 1
          fi

          chmod +x "$PROJ/gradlew"

          echo "Project directory: $PROJ"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"


      # 3. Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # 4. Setup Android SDK
      # Disable automatic license acceptance here
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: "false"
          log-accepted-android-sdk-licenses: "false"


      # 5. Manually accept SDK licenses
      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import subprocess
          import sys

          sdkmanager = shutil.which("sdkmanager")

          if not sdkmanager:
              sdk = os.environ.get("ANDROID_HOME") or \
                    os.environ.get("ANDROID_SDK_ROOT")

              if sdk:
                  sdkmanager = os.path.join(
                      sdk,
                      "cmdline-tools",
                      "latest",
                      "bin",
                      "sdkmanager"
                  )

          if not sdkmanager or not os.path.isfile(sdkmanager):
              sys.exit("ERROR: sdkmanager not found!")

          print("Using SDK Manager:", sdkmanager)

          try:
              result = subprocess.run(
                  [sdkmanager, "--licenses"],
                  input="y\n" * 100,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=180
              )

              print(result.stdout[-5000:])

              if result.returncode != 0:
                  sys.exit("ERROR: SDK license acceptance failed!")

              if "not accepted" in result.stdout.lower():
                  sys.exit("ERROR: Some SDK licenses remain unaccepted!")

              print("SDK license step completed successfully.")

          except subprocess.TimeoutExpired:
              sys.exit("ERROR: SDK license acceptance timed out!")
          PY


      # 6. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # 7. Verify Gradle Wrapper
      - name: Check Gradle
        shell: bash
        run: |
          cd "$PROJ"
          ./gradlew --version


      # 8. Build Release APK
      - name: Build Release APK
        shell: bash
        run: |
          cd "$PROJ"

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --console=plain


      # 9. Prepare APK ZIP
      - name: Prepare APK ZIP
        shell: bash
        run: |
          APK=$(find "$PROJ/app/build/outputs/apk/release" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK file not found!"
            exit 1
          fi

          mkdir -p dist

          cp "$APK" dist/BlueWavePlayer.apk

          cd dist

          zip BlueWavePlayer-APK.zip BlueWavePlayer.apk

          echo "APK ZIP created:"
          ls -lh BlueWavePlayer-APK.zip


      # 10. Upload APK ZIP as Artifact
      - name: Upload APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BlueWavePlayer-APK
          path: dist/BlueWavePlayer-APK.zip


      # 11. Publish GitHub Release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v${{ github.run_number }}"

          gh release create "$TAG" \
            dist/BlueWavePlayer-APK.zip \
            --target "${{ github.sha }}" \
            --title "BlueWavePlayer Build ${{ github.run_number }}" \
            --notes "Android Release APK"
            
